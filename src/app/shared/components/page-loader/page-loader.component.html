@if (isLoading()) {
  <div @fadeIn class="page-loader-backdrop">
    <div class="page-loader-shimmer"></div>
    <div class="page-loader-content">
      <div class="page-loader-ring">
        <div class="page-loader-arc"></div>
      </div>
      <div class="page-loader-dot"></div>
    </div>
  </div>
}
