@if (isLoading()) {
  <div
    @overlayFade
    class="page-loader-backdrop"
    role="status"
    aria-live="polite"
    aria-label="Cargando módulo"
  >
    <div class="page-loader-content">
      <img src="assets/images/icono.png" alt="" aria-hidden="true" class="page-loader-logo" />
      <div class="page-loader-bar-track" aria-hidden="true">
        <div class="page-loader-bar-fill"></div>
      </div>
      <p class="page-loader-caption">Cargando módulo…</p>
    </div>
  </div>
}
