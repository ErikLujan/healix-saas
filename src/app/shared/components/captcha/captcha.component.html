<div class="space-y-2">
  <div
    class="captcha-challenge relative flex flex-wrap items-center gap-3 p-3 bg-background rounded-xl border border-border overflow-hidden"
    role="group"
    [attr.aria-label]="challengeType() === 'math' ? 'Desafío matemático: ' + mathLabel() : 'Desafío alfanumérico'"
  >
    <div class="captcha-interference"></div>

    @if (challengeType() === 'math') {
      <div class="flex items-center gap-2 text-sm text-text-primary font-semibold select-none relative z-10">
        <span>{{ operandA() }}</span>
        <span class="text-text-secondary">+</span>
        <span>{{ operandB() }}</span>
        <span class="text-text-secondary">=</span>
      </div>
    } @else {
      <div class="flex items-center gap-0.5 select-none relative z-10" aria-hidden="true">
        @for (item of distortedChars(); track $index) {
          <span
            class="inline-block font-bold text-text-primary captcha-alpha-char"
            [style.fontSize.px]="item.fontSize"
            [style.transform]="'rotate(' + item.rotation + 'deg) translate(' + item.offsetX + 'px, ' + item.offsetY + 'px)'"
          >{{ item.char }}</span>
        }
      </div>
    }

    <input [formControl]="control" [type]="challengeType() === 'math' ? 'number' : 'text'" [placeholder]="challengeType() === 'math' ? '?' : 'Escribí aquí'" [attr.aria-label]="challengeType() === 'math' ? 'Resultado de la suma' : 'Escriba los caracteres mostrados'" [disabled]="isVerified()" [ngClass]="{ 'border-success': isVerified(), 'bg-success/5': isVerified(), 'text-success': isVerified(), 'border-danger': !!errorMessage() }" class="captcha-input relative z-10 w-24 sm:w-28 px-3 py-1.5 text-sm text-center rounded-lg border bg-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 text-text-primary" (input)="onInput()" (keydown.enter)="verificar()" autocomplete="off" />

    @if (!isVerified()) {
      <button
        type="button"
        (click)="verificar()"
        class="relative z-10 px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-lg
               hover:opacity-90 active:scale-[0.98] transition-all duration-200
               focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:outline-none"
      >
        Verificar
      </button>
      <button
        type="button"
        (click)="generarDesafio()"
        class="relative z-10 p-1.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface
               transition-colors duration-200 focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:outline-none"
        aria-label="Generar nuevo captcha"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </button>
    } @else {
      <div class="relative z-10 flex items-center gap-1.5 text-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span class="text-xs font-medium">Verificado</span>
      </div>
    }
  </div>

  @if (errorMessage()) {
    <p class="text-xs text-danger flex items-center gap-1.5" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ errorMessage() }}
    </p>
  }
</div>
