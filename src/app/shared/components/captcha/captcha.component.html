<div class="space-y-2">
  <div class="flex flex-wrap items-center gap-3 p-3 bg-background rounded-xl border border-border">
    <div class="flex items-center gap-2 text-sm text-text-primary font-medium select-none">
      <span>{{ a() }}</span>
      <span class="text-text-secondary">+</span>
      <span>{{ b() }}</span>
      <span class="text-text-secondary">=</span>
    </div>
    <input
      [formControl]="control"
      type="number"
      placeholder="?"
      [disabled]="verified()"
      class="w-20 px-3 py-1.5 text-sm text-center rounded-lg border bg-surface
             focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
             transition-all duration-200
             {{ verified() ? 'border-success bg-success/5 text-success' : errorMessage() ? 'border-danger' : 'border-border' }}"
      (input)="onInput()"
      (keydown.enter)="verify()"
      autocomplete="off"
    />
    @if (!verified()) {
      <button
        type="button"
        (click)="verify()"
        class="px-3 py-1.5 text-xs font-medium text-white bg-primary rounded-lg hover:opacity-90 transition-opacity"
      >
        Verificar
      </button>
      <button
        type="button"
        (click)="refresh()"
        class="p-1.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface transition-colors"
        aria-label="Generar nuevo captcha"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </button>
    } @else {
      <div class="flex items-center gap-1.5 text-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span class="text-xs font-medium">Verificado</span>
      </div>
    }
  </div>
  @if (errorMessage()) {
    <p class="text-xs text-danger">{{ errorMessage() }}</p>
  }
</div>
