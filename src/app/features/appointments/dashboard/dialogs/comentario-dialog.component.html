@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/40 backdrop-blur-sm" (click)="cerrar()"></div>
    <div class="relative w-full max-w-md rounded-2xl bg-surface border border-border shadow-2xl p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-text-primary">{{ titulo() }}</h3>
        <button type="button" (click)="cerrar()" class="rounded-lg p-1.5 text-text-secondary hover:bg-background transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <textarea [ngModel]="comentario()" (ngModelChange)="actualizarComentario($event)" [placeholder]="placeholder()"
        rows="4" class="w-full rounded-xl border border-border bg-background px-4 py-3 text-sm text-text-primary placeholder:text-text-secondary/50 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary resize-none transition-all"></textarea>
      <div class="flex justify-end gap-3">
        <button type="button" (click)="cerrar()"
          class="rounded-xl border border-border px-4 py-2 text-sm font-medium text-text-secondary hover:bg-background transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
          Cancelar
        </button>
        <button type="button" (click)="confirmar()" [disabled]="!comentario().trim()"
          class="rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary/90 disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
          {{ textoConfirmar() }}
        </button>
      </div>
    </div>
  </div>
}
