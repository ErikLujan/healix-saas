@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog" aria-modal="true" [attr.aria-label]="titulo()">
    <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs animate-in fade-in-0 duration-200" (click)="cerrar()"></div>
    <div class="relative w-full max-w-md rounded-2xl bg-surface border border-divider shadow-2xl p-4 sm:p-6 space-y-4 animate-in fade-in-0 zoom-in-95 duration-200">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-text-primary">{{ titulo() }}</h3>
        <button type="button" (click)="cerrar()"
          class="rounded-xl p-1.5 text-text-subtle hover:bg-danger/10 hover:text-danger transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-brand-500/20 active:scale-95"
          aria-label="Cerrar">
          <svg lucideIcon="x" class="h-5 w-5"></svg>
        </button>
      </div>

      @if (modoSoloConfirmacion()) {
        <p class="text-sm text-text-secondary leading-relaxed">{{ descripcion() }}</p>
      } @else {
        <div>
          <textarea [ngModel]="comentario()" (ngModelChange)="actualizarComentario($event)" [placeholder]="placeholder()"
            rows="4" class="w-full rounded-xl border border-divider bg-background px-4 py-3 text-sm text-text-primary placeholder:text-text-secondary/50 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 resize-none transition-all"
            [ngClass]="comentario().length > 0 && !comentarioValido() ? 'border-red-400 focus:ring-red-200 focus:border-red-400' : ''"></textarea>
          @if (comentario().length > 0 && !comentarioValido()) {
            <p class="mt-1 text-xs text-red-500">El motivo debe tener al menos 10 caracteres.</p>
          }
        </div>
      }

      <div class="flex justify-end gap-3">
        <button type="button" (click)="cerrar()"
          class="rounded-xl border border-border px-4 py-2 text-sm font-medium text-text-secondary hover:bg-background transition-all duration-150 active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:ring-offset-2">
          Cancelar
        </button>
        <button type="button" (click)="confirmar()" [disabled]="!comentarioValido()"
          class="rounded-xl bg-brand-700 px-4 py-2 text-sm font-semibold text-white transition-all duration-150 hover:bg-brand-700/90 disabled:opacity-40 disabled:cursor-not-allowed active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:ring-offset-2">
          {{ textoConfirmar() }}
        </button>
      </div>
    </div>
  </div>
}
