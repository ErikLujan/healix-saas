@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm"
       (click)="onBackdropClick($event)" (keydown)="onKeyDown($event)" role="dialog" aria-modal="true" aria-label="Calificar atención">
    <div class="w-full max-w-md bg-surface rounded-2xl shadow-2xl border border-border overflow-hidden transform transition-all">
      <div class="flex items-center justify-between px-6 py-4 border-b border-border">
        <h3 class="text-lg font-bold text-text-primary">Calificar Atención</h3>
        <button type="button" (click)="cerrar()"
          class="p-1.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-background transition-colors focus:outline-none focus:ring-2 focus:ring-primary"
          aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="px-6 py-5 space-y-5">
        <div class="text-center">
          <p class="text-sm text-text-secondary mb-3">¿Cómo fue tu experiencia?</p>
          <div class="flex items-center justify-center gap-1" role="radiogroup" aria-label="Puntuación">
            @for (i of estrellasArray; track i) {
              <button type="button" (click)="seleccionarEstrellas(i)"
                (mouseenter)="estrellaHover.set(i)" (mouseleave)="estrellaHover.set(0)"
                class="p-1 transition-transform hover:scale-110 focus:outline-none"
                [attr.aria-label]="i + ' estrella' + (i > 1 ? 's' : '')"
                [attr.aria-checked]="estrellas() === i" role="radio">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 transition-colors duration-150"
                     [ngClass]="(estrellaHover() || estrellas()) >= i ? 'text-amber-400' : 'text-gray-200'"
                     viewBox="0 0 24 24" fill="currentColor" stroke="none">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
              </button>
            }
          </div>
          @if (estrellas() > 0) {
            <p class="mt-2 text-xs text-text-secondary">{{ estrellas() }} de 5 estrellas</p>
          }
        </div>

        <div>
          <label for="comentario-calificacion" class="block text-sm font-medium text-text-primary mb-1.5">Tu opinión</label>
          <textarea id="comentario-calificacion" rows="3" [ngModel]="comentario()" (ngModelChange)="actualizarComentario($event)"
            placeholder="Contanos sobre tu experiencia con el especialista..."
            class="w-full px-3 py-2 text-sm rounded-lg border border-border bg-background text-text-primary placeholder:text-text-secondary/50 resize-none focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"></textarea>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-border bg-background/50 flex items-center justify-end gap-3">
        <button type="button" (click)="cerrar()" [disabled]="isEnviando()"
          class="rounded-lg border border-border px-4 py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-background disabled:opacity-50 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
          Cancelar
        </button>
        <button type="button" (click)="confirmar()" [disabled]="botonDeshabilitado()"
          class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
          @if (isEnviando()) {
            Enviando...
          } @else {
            Enviar Calificación
          }
        </button>
      </div>
    </div>
  </div>
}
