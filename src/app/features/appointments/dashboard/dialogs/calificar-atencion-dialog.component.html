@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs animate-in fade-in-0 duration-200"
       (click)="onBackdropClick($event)"
       role="dialog" aria-modal="true" [attr.aria-label]="esLectura() ? 'Calificación de atención' : 'Calificar atención'">
    <div class="w-full max-w-md bg-surface rounded-2xl shadow-2xl border border-divider overflow-hidden animate-in fade-in-0 zoom-in-95 duration-200">
      <div class="flex items-center justify-between px-4 py-4 sm:px-6 border-b border-divider">
        <h3 class="text-lg font-bold text-text-primary">{{ esLectura() ? 'Calificación de Atención' : 'Calificar Atención' }}</h3>
        <button type="button" (click)="cerrar()"
          class="p-1.5 rounded-xl text-text-subtle hover:text-danger hover:bg-danger/10 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-brand-500/20 active:scale-95"
          aria-label="Cerrar">
          <svg lucideIcon="x" class="w-5 h-5"></svg>
        </button>
      </div>

      <div class="px-4 py-5 sm:px-6 space-y-5">
        <div class="text-center">
          <p class="text-sm text-text-secondary mb-3">{{ esLectura() ? 'Experiencia reportada' : '¿Cómo fue tu experiencia?' }}</p>
          <div class="flex items-center justify-center gap-1" role="radiogroup" aria-label="Puntuación">
            @for (i of estrellasArray; track i) {
              <button type="button" (click)="seleccionarEstrellas(i)"
                (mouseenter)="!esLectura() && estrellaHover.set(i)" (mouseleave)="!esLectura() && estrellaHover.set(0)"
                class="p-1 transition-transform duration-150 focus:outline-none"
                [class.pointer-events-none]="esLectura()"
                [class.hover:scale-110]="!esLectura()"
                [class.active:scale-95]="!esLectura()"
                [attr.aria-label]="i + ' estrella' + (i > 1 ? 's' : '')"
                [attr.aria-checked]="estrellas() === i" role="radio">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 transition-colors duration-150"
                     [ngClass]="(estrellaHover() || estrellas()) >= i ? 'text-amber-400' : 'text-gray-200'"
                     viewBox="0 0 24 24" fill="currentColor" stroke="none">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
              </button>
            }
          </div>
          @if (estrellas() > 0) {
            <p class="mt-2 text-xs text-text-secondary">{{ estrellas() }} de 5 estrellas</p>
          }
        </div>

        <div>
          <label for="comentario-calificacion" class="block text-sm font-medium text-text-primary mb-1.5">{{ esLectura() ? 'Opinión' : 'Tu opinión' }}</label>
          <textarea id="comentario-calificacion" rows="3" [ngModel]="comentario()" (ngModelChange)="actualizarComentario($event)"
            [placeholder]="esLectura() ? '' : 'Contanos sobre tu experiencia con el especialista...'"
            [readonly]="esLectura()"
            class="w-full px-3 py-2 text-sm rounded-xl border border-divider bg-background text-text-primary placeholder:text-text-secondary/50 resize-none focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
            [class.cursor-default]="esLectura()"></textarea>
        </div>
      </div>

      <div class="px-4 py-4 sm:px-6 border-t border-divider bg-background/50 flex items-center justify-end gap-3">
        <button type="button" (click)="cerrar()"
          class="rounded-xl border border-border px-4 py-2 text-sm font-medium text-text-secondary transition-all duration-150 hover:bg-background active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:ring-offset-2">
          {{ esLectura() ? 'Cerrar' : 'Cancelar' }}
        </button>
        @if (!esLectura()) {
          <button type="button" (click)="confirmar()" [disabled]="botonDeshabilitado()"
            class="rounded-xl bg-brand-700 px-4 py-2 text-sm font-semibold text-white transition-all duration-150 hover:bg-brand-700/90 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:ring-offset-2">
            @if (isEnviando()) {
              Enviando...
            } @else {
              Enviar Calificación
            }
          </button>
        }
      </div>
    </div>
  </div>
}
