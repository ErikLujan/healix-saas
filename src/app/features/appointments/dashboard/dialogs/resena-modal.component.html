@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm"
       (click)="onBackdropClick($event)" (keydown)="onKeyDown($event)" role="dialog" aria-modal="true" aria-label="Reseña médica">
    <div class="w-full max-w-lg bg-surface rounded-2xl shadow-2xl border border-border overflow-hidden transform transition-all">
      <div class="flex items-center justify-between px-6 py-4 border-b border-border">
        <h3 class="text-lg font-bold text-text-primary">Reseña Médica</h3>
        <button type="button" (click)="cerrar()"
          class="p-1.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-background transition-colors focus:outline-none focus:ring-2 focus:ring-primary"
          aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="px-6 py-5">
        <p class="text-sm text-text-primary leading-relaxed tracking-wide whitespace-pre-wrap">{{ resenaTexto() }}</p>
      </div>
      <div class="px-6 py-3 border-t border-border bg-background/50 flex justify-end">
        <button type="button" (click)="cerrar()"
          class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
          Cerrar
        </button>
      </div>
    </div>
  </div>
}
