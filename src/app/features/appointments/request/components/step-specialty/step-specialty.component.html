<div class="space-y-6">
  @if (isLoading()) {
    <div class="flex items-center justify-center py-16">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
      <span class="ml-3 text-text-secondary">Cargando especialidades...</span>
    </div>
  } @else {
    <p class="text-text-secondary text-sm">Seleccioná la especialidad médica que necesitás.</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (esp of especialidades(); track esp.id) {
        <button type="button" (click)="seleccionar(esp)"
          class="group relative flex flex-col items-center gap-3 p-6 rounded-xl border-2 transition-all duration-200 text-center hover:border-primary hover:shadow-md hover:bg-primary/5 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
          [ngClass]="{'border-primary bg-primary/5': seleccionada()?.id === esp.id, 'border-border': seleccionada()?.id !== esp.id}">
          <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
          </div>
          <span class="font-medium text-text-primary group-hover:text-primary transition-colors">{{ esp.name }}</span>
          @if (seleccionada()?.id === esp.id) {
            <div class="absolute top-2 right-2"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg></div>
          }
        </button>
      } @empty {
        <div class="col-span-full text-center py-12"><p class="text-text-secondary">No hay especialidades disponibles en este momento.</p></div>
      }
    </div>
  }
</div>
