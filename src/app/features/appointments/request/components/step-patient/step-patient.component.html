<div class="space-y-6">
  <p class="text-text-secondary text-sm">
    Seleccioná el paciente para quien se solicitará el turno.
  </p>

  @if (isLoading()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" role="group" aria-label="Cargando pacientes">
      @for (i of [1,2,3,4]; track i) {
        <div class="flex items-center gap-4 p-4 rounded-xl border-2 border-divider bg-surface">
          <div class="h-10 w-10 rounded-full animate-shimmer"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 w-32 rounded-full animate-shimmer"></div>
            <div class="h-3 w-48 rounded-full animate-shimmer"></div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-text-subtle" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        type="text"
        [value]="busqueda()"
        (input)="onBusquedaChange($any($event.target).value)"
        placeholder="Buscar por nombre o email..."
        class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-divider bg-surface text-text-primary placeholder:text-text-subtle focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      @for (paciente of pacientesFiltrados(); track paciente.id) {
        <button type="button" (click)="seleccionar(paciente)"
          class="group relative flex items-center gap-4 p-4 rounded-xl border-2 transition-all duration-200 text-left hover:border-brand-500 hover:shadow-md hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 active:scale-[0.97]"
          [ngClass]="{'border-brand-500 bg-brand-50 shadow-md': seleccionado()?.id === paciente.id, 'border-divider bg-surface': seleccionado()?.id !== paciente.id}">
          @if (paciente.avatar_url) {
            <img [src]="paciente.avatar_url" [alt]="paciente.full_name"
              class="h-10 w-10 rounded-full object-cover border border-border" fallbackAvatar />
          } @else {
            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-100 text-brand-700 font-semibold text-sm">
              {{ paciente.full_name.charAt(0) }}
            </div>
          }
          <div class="flex-1 min-w-0">
            <p class="font-medium text-text-primary truncate">{{ paciente.full_name }}</p>
            <p class="text-xs text-text-subtle truncate">{{ paciente.email }}</p>
          </div>
          @if (seleccionado()?.id === paciente.id) {
            <div class="flex-shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-700" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
            </div>
          }
        </button>
      } @empty {
        <div class="col-span-full text-center py-12">
          <p class="text-text-subtle">No se encontraron pacientes "{{ busqueda() }}".</p>
        </div>
      }
    </div>
  }
</div>
