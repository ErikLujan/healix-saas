<div class="space-y-6">
  @if (isLoading()) {
    <div class="flex items-center justify-center py-16">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
      <span class="ml-3 text-text-secondary">Calculando disponibilidad...</span>
    </div>
  } @else {
    <p class="text-text-secondary text-sm">Seleccioná un día disponible en los próximos 15 días.</p>
    @for (grupo of agrupadasPorMes(); track grupo[0]) {
      <div class="space-y-3">
        <h3 class="text-xs font-semibold text-text-secondary uppercase tracking-wider">{{ grupo[0] }}</h3>
        <div class="flex flex-wrap gap-2">
          @for (fecha of grupo[1]; track fecha.fecha) {
            <button type="button" (click)="seleccionar(fecha)"
              class="relative flex flex-col items-center gap-1 min-w-[4.5rem] px-3 py-3 rounded-xl border-2 transition-all duration-200 hover:border-primary hover:shadow-sm hover:bg-primary/5 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
              [ngClass]="{'border-primary bg-primary/5': seleccionada() === fecha.fecha, 'border-border': seleccionada() !== fecha.fecha}">
              <span class="text-xs font-medium" [ngClass]="{'text-primary': seleccionada() === fecha.fecha, 'text-text-secondary': seleccionada() !== fecha.fecha}">{{ fecha.diaNombre }}</span>
              <span class="text-lg font-bold" [ngClass]="{'text-primary': seleccionada() === fecha.fecha, 'text-text-primary': seleccionada() !== fecha.fecha}">{{ fecha.diaNumero }}</span>
              @if (fecha.esHoy) {
                <span class="absolute -top-1.5 -right-1.5 inline-flex items-center rounded-full bg-primary px-1.5 py-0.5 text-[10px] font-bold text-white">HOY</span>
              }
            </button>
          }
        </div>
      </div>
    } @empty {
      <div class="text-center py-12">
        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-text-secondary/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
        <p class="mt-3 text-text-secondary">No hay días disponibles en los próximos 15 días.</p>
      </div>
    }
  }
</div>
