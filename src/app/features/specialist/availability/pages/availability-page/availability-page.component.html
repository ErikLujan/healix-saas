<div class="w-full min-w-0 space-y-6">
  @if (isLoadingData()) {
    <div class="space-y-6" role="status" aria-label="Cargando disponibilidad">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="space-y-2">
          <div class="h-8 w-48 rounded-xl animate-shimmer"></div>
          <div class="h-4 w-72 rounded-full animate-shimmer"></div>
        </div>
        <div class="h-10 w-28 rounded-xl animate-shimmer"></div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <div class="xl:col-span-2 space-y-3">
          @for (i of [1, 2, 3, 4, 5, 6]; track i) {
            <div class="bg-surface rounded-2xl border border-border p-4 flex items-center gap-3">
              <div class="h-6 w-11 rounded-full animate-shimmer"></div>
              <div class="h-4 w-20 rounded-full animate-shimmer"></div>
              <div class="ml-auto h-4 w-12 rounded-full animate-shimmer"></div>
            </div>
          }
        </div>
        <div class="xl:col-span-1">
          <div class="bg-surface rounded-2xl border border-border p-5 space-y-4">
            <div class="h-4 w-32 rounded-full animate-shimmer"></div>
            <div class="h-3 w-48 rounded-full animate-shimmer"></div>
            <div class="h-10 w-full rounded-xl animate-shimmer"></div>
            <div class="space-y-2">
              @for (i of [1, 2, 3]; track i) {
                <div class="h-8 w-full rounded-lg animate-shimmer"></div>
              }
            </div>
          </div>
        </div>
      </div>

      <span class="sr-only">Cargando disponibilidad...</span>
    </div>
  } @else {
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-text-primary">Disponibilidad</h1>
        <p class="text-sm text-text-secondary mt-1">
          Define tus bloques horarios para la semana. Los pacientes verán slots libres.
        </p>
      </div>
      <button
        type="button"
        (click)="onGuardar()"
        [disabled]="isLoading() || !tieneCambiosPendientes()"
        class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-primary text-white text-sm font-semibold rounded-xl
               hover:opacity-90 active:scale-[0.98] transition-all duration-200
               focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:outline-none
               disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100
               w-full sm:w-auto"
      >
        @if (isLoading()) {
          <svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
      <div class="xl:col-span-2">
        <app-availability-form
          [configuracion]="configuracion()"
          [especialidades]="especialidades()"
          [diasDisponibles]="diasDisponibles"
          (configuracionChange)="onConfiguracionChange($event.dia, $event.config)"
        />
      </div>

      <div class="xl:col-span-1">
        <app-slots-preview
          [configuracion]="configuracion()"
          [especialidades]="especialidades()"
          [diasDisponibles]="diasDisponibles"
        />
      </div>
    </div>
  }
</div>
