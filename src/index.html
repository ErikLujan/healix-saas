<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Healix | Angular 19 &amp; Supabase Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Healix, portfolio de ingeniería frontend: SaaS clínico construido con Angular 19 standalone, Signals, Supabase (Auth, Postgres, RLS, Storage) y Tailwind CSS v4 por Erik Lujan.">
  <meta name="author" content="Erik Lujan">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f766e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Healix | Angular 19 & Supabase Portfolio">
  <meta property="og:description" content="SaaS clínico demo construido con Angular 19 standalone, Signals, Supabase y Tailwind CSS v4. Arquitectura por roles, turnos en tiempo real e historia clínica centralizada.">
  <meta property="og:image" content="assets/images/clinica-foto.webp">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Healix | Angular 19 & Supabase Portfolio">
  <meta name="twitter:description" content="Portfolio técnico: Angular 19, Signals, Supabase (RLS) y Tailwind CSS v4 en un SaaS clínico funcional.">
  <meta name="twitter:image" content="assets/images/clinica-foto.webp">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .healix-preloader {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FAFAF7;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .healix-preloader.hide {
      opacity: 0; pointer-events: none;
    }

    /* --- Logo: breathing pulse --- */
    .healix-logo {
      width: 56px; height: 56px; border-radius: 14px; object-fit: cover;
      animation: healix-breathe 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      will-change: transform, opacity;
    }
    @keyframes healix-breathe {
      0%, 100% { transform: scale(0.97); opacity: 0.85; }
      50%      { transform: scale(1.02); opacity: 1; }
    }

    /* --- Barra indeterminada corporativa: idéntica al PageLoader de Angular --- */
    .healix-bar-track {
      margin-top: 24px; width: 180px; height: 3px; border-radius: 9999px;
      background: #E5E7EB; overflow: hidden; position: relative;
    }
    .healix-bar-fill {
      width: 40%; height: 100%; border-radius: 9999px;
      background: #2A857F;
      animation: healix-indeterminate 1.4s linear infinite;
      will-change: transform;
    }
    @keyframes healix-indeterminate {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(280%); }
    }

    /* --- Caption --- */
    .healix-caption {
      margin-top: 16px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
      color: #94A3B8;
      opacity: 0;
      animation: healix-fade-in 0.6s 0.4s ease forwards;
    }
    @keyframes healix-fade-in {
      to { opacity: 1; }
    }
  </style>
</head>
<body class="antialiased">
  <div id="healix-preloader" class="healix-preloader">
    <img src="assets/images/icono.png" alt="Logotipo de Healix" width="768" height="547" class="healix-logo" />
    <div class="healix-bar-track"><div class="healix-bar-fill"></div></div>
    <p class="healix-caption">Cargando plataforma medica...</p>
  </div>
  <app-root></app-root>
  <script>
    (function() {
      var preloader = document.getElementById('healix-preloader');
      if (!preloader) return;
      var appRoot = document.querySelector('app-root');
      if (appRoot) {
        var obs = new MutationObserver(function() {
          if (appRoot.children.length > 0) {
            preloader.classList.add('hide');
            setTimeout(function() { preloader.remove(); }, 400);
            obs.disconnect();
          }
        });
        obs.observe(appRoot, { childList: true });
      }
      setTimeout(function() {
        preloader.classList.add('hide');
        setTimeout(function() { preloader.remove(); }, 400);
      }, 4000);
    })();
  </script>
</body>
</html>
